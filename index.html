<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכנון קמפינג</title>

<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #1E3A2F;
    --amber: #E8963A;
    --bg: #EEF0E6;
    --ink: #22271F;
    --muted: #8A907C;
    --line: #E2E4D8;
    --line-dash: #C9CDB9;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Assistant', 'Heebo', sans-serif;
  }
  input, button, textarea, select { font-family: inherit; }
  input { border: none; background: transparent; font-size: 14px; color: var(--ink); }
  input:focus { outline: none; }
  input::placeholder { color: #A3A894; }
  button { cursor: pointer; border: none; background: none; }

  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 48px; }

  /* ---- שלט ---- */
  .sign {
    background: var(--pine);
    color: #fff;
    padding: 20px 16px 16px;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 14px rgba(30,58,47,.25);
  }
  .sign-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .sign-title { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .sign-title svg { flex-shrink: 0; color: var(--amber); }
  .sign-title input {
    font-family: 'Secular One', 'Assistant', sans-serif;
    font-size: 24px; color: #fff; width: 100%;
  }
  .sign-title input::placeholder { color: rgba(209,229,208,.5); }
  .sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #B9C7B0; padding-top: 8px; flex-shrink: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6B7160; }
  .dot.on { background: #7BD88F; }
  .dot.err { background: #F87171; }
  .sign-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; color: #B9C7B0; }
  .sign-meta > div { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
  .sign-meta svg { flex-shrink: 0; }
  .sign-meta input { color: #D7E0CF; width: 100%; }
  .sign-meta input::placeholder { color: rgba(185,199,176,.6); }
  .who { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: #B9C7B0; }
  .who b { color: #fff; }
  .who-switch { background: rgba(255,255,255,.15); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 8px; font-weight: 600; }
  .who-switch:active { transform: scale(.97); }

  /* ---- טאבים ---- */
  .tabs {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 16px 8px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: #fff; color: #57604F; border: 1px solid #DDE0D2;
    transition: transform .1s;
  }
  .tab:active { transform: scale(.97); }
  .tab.active { background: var(--pine); color: #fff; border-color: var(--pine); box-shadow: 0 2px 8px rgba(30,58,47,.3); }
  .tab .badge {
    font-size: 11px; padding: 2px 6px; border-radius: 6px;
    background: var(--bg); color: var(--muted);
  }
  .tab.active .badge { background: rgba(232,150,58,.25); color: #F5C284; }

  /* ---- רשימה ---- */
  .list { padding: 4px 16px 0; display: flex; flex-direction: column; gap: 8px; }

  /* ---- כרטיס ---- */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card.done { opacity: .6; }
  .card.add-open { border: 2px dashed var(--line-dash); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 10px; }
  .card-main { flex: 1; min-width: 0; cursor: pointer; }
  .card-title { font-weight: 600; font-size: 15px; }
  .card.done .card-title { text-decoration: line-through; }
  .card-sub { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-by { font-size: 11px; color: #A3A894; margin-top: 3px; }
  .chev { color: var(--muted); display: flex; transition: transform .15s; cursor: pointer; flex-shrink: 0; }
  .chev.open { transform: rotate(180deg); }
  .card-body { padding: 10px 12px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }

  .chk {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--line-dash); color: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: all .12s;
  }
  .chk.on { background: var(--pine); border-color: var(--pine); color: #fff; }
  .del { color: #D6D8CC; padding: 4px; flex-shrink: 0; display: flex; }
  .del:hover { color: #EF4444; }

  /* ---- טפסים ---- */
  .flabel { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 6px; }
  .finput { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 14px; width: 100%; background: #fff; }
  .finput:focus { outline: none; border-color: var(--pine); }
  .fnum { width: 100px; }
  .ftext { min-height: 58px; resize: vertical; font-family: inherit; line-height: 1.5; }
  .fsel { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 14px; width: 100%; background: #fff; color: var(--ink); }
  .fsel:focus { outline: none; border-color: var(--pine); }
  .form-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-save { flex: 1; background: var(--pine); color: #fff; font-weight: 600; padding: 10px; border-radius: 10px; font-size: 14px; }
  .btn-cancel { flex: 1; background: var(--bg); color: #57604F; font-weight: 600; padding: 10px; border-radius: 10px; font-size: 14px; }
  .btn-del { background: #fff; border: 1px solid #F0D0D0; color: #EF4444; font-weight: 600; padding: 10px 14px; border-radius: 10px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .btn-save:active, .btn-cancel:active, .btn-del:active { transform: scale(.98); }

  .add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 2px dashed var(--line-dash); border-radius: 12px;
    padding: 11px; font-size: 14px; font-weight: 600; color: #6B7160; width: 100%;
  }
  .add:active { transform: scale(.99); }
  .add.sub { padding: 9px; font-size: 13px; }

  .empty {
    text-align: center; font-size: 14px; color: var(--muted);
    background: rgba(255,255,255,.6); border: 1px dashed var(--line-dash);
    border-radius: 16px; padding: 20px; line-height: 1.6;
  }
  .fill-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
    background: var(--amber); color: #fff; font-weight: 600; font-size: 14px;
    padding: 8px 16px; border-radius: 12px;
  }
  .fill-row { text-align: center; margin: 2px 0 8px; }
  .fill-row .fill-btn { margin-top: 0; }
  .seg { display: flex; gap: 6px; }
  .seg-btn {
    flex: 1; padding: 8px 10px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: #fff; color: #57604F; border: 1px solid #DDE0D2;
  }
  .seg-btn:active { transform: scale(.97); }
  .seg-btn.active { background: var(--pine); color: #fff; border-color: var(--pine); box-shadow: 0 2px 8px rgba(30,58,47,.3); }
  .claim {
    flex-shrink: 0; font-size: 13px; font-weight: 700;
    padding: 6px 12px; border-radius: 10px;
    background: var(--bg); color: var(--pine); border: 1px solid var(--line);
  }
  .claim.on { background: var(--pine); color: #fff; border-color: var(--pine); }
  .claim:active { transform: scale(.97); }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; line-height: 1.7; padding: 0 16px; }
  .sub-head { font-weight: 700; color: var(--pine); font-size: 16px; margin: 16px 2px 2px; display: flex; align-items: center; gap: 6px; }

  /* ---- הצעות מחיר ---- */
  .qbadges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .qbadge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: var(--bg); color: var(--muted); }
  .price { color: var(--pine); font-weight: 700; white-space: nowrap; }

  /* ---- AI ---- */
  .btn-ai { margin-top: 8px; background: rgba(232,150,58,.16); color: #B06A18; font-weight: 600; padding: 10px; border-radius: 10px; font-size: 14px; width: 100%; }
  .btn-ai:active { transform: scale(.99); }
  .ai-panel { margin-top: 8px; background: var(--bg); border-radius: 10px; padding: 12px; }
  .ai-title { font-weight: 600; margin-bottom: 6px; font-size: 13px; color: var(--pine); }
  .ai-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; cursor: pointer; }
  .ai-item input { width: 18px; height: 18px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line-dash); border-top-color: var(--pine); border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- מסך "מי אני" ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(30,58,47,.97);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  .ov-box { width: 100%; max-width: 360px; text-align: center; color: #fff; }
  .ov-box h2 { font-family: 'Secular One', sans-serif; font-size: 28px; margin-bottom: 4px; }
  .ov-box p { color: #B9C7B0; margin-bottom: 22px; }
  .ov-names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ov-name { background: #fff; color: var(--pine); font-weight: 700; font-size: 16px; padding: 15px; border-radius: 14px; }
  .ov-name:active { transform: scale(.97); }
  .ov-other { background: var(--amber); color: #fff; grid-column: span 2; }
  .ov-input-row { margin-top: 14px; display: flex; gap: 8px; }
  .ov-input-row input { flex: 1; background: #fff; border-radius: 12px; padding: 12px; font-size: 15px; }
  .ov-input-row button { background: var(--amber); color: #fff; font-weight: 700; padding: 0 18px; border-radius: 12px; }

  /* ---- מסך הגדרה ---- */
  .setup {
    margin: 24px 16px; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; line-height: 1.8; font-size: 14px;
  }
  .setup h2 { font-family: 'Secular One', sans-serif; color: var(--pine); margin-bottom: 8px; }
  .setup code { background: var(--bg); padding: 1px 6px; border-radius: 6px; direction: ltr; display: inline-block; }
</style>
</head>

/* ---------- מצב ---------- */
let fbApp = null;
let db = null;
let appCheck = null;
let state = { meta: {}, items: {}, guests: {}, quotes: {} };
let tab = "people";
let shopBucket = "buy"; // buy | home — תת־טאב בקניות
let connected = "off"; // off | on | err
const timers = {};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");

/* מצב-UI (לא נשמר ב-DB) */
let currentUser = localStorage.getItem("campUser") || "";
let showOverlay = !currentUser;
let overlayOther = false;
const openCards = new Set();        // "section:id" — כרטיסי עריכה פתוחים
const addOpen = new Set();          // הקשרים של טופס-הוספה פתוח: "add:people", "add:quotes"...
const drafts = {};                  // ctx -> { field: value, _other_<field>: bool }
const aiState = {};                 // mealId -> { loading, suggestions:[{text,checked}] }

const configMissing = firebaseConfig.apiKey.includes("PASTE");

/* ---------- Firebase ---------- */
if (!configMissing) {
  try {
    fbApp = initializeApp(firebaseConfig);
    db = getDatabase(fbApp);
    try {
      appCheck = initializeAppCheck(fbApp, { provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY), isTokenAutoRefreshEnabled: true });
    } catch (e) { console.warn("appcheck", e); }
    onValue(ref(db, "trip"), (snap) => {
      state = snap.val() || {};
      state.meta = state.meta || {};
      state.items = state.items || {};
      state.guests = state.guests || {};
      state.quotes = state.quotes || {};
      connected = "on";
      render();

  } catch (e) {
    connected = "err";

const wr = (p, v) => { if (db) set(ref(db, "trip/" + p), v); };
const up = (p, v) => { if (db) update(ref(db, "trip/" + p), v); };
const rm = (p) => { if (db) remove(ref(db, "trip/" + p)); };
const debounced = (key, fn) => { clearTimeout(timers[key]); timers[key] = setTimeout(fn, 500); };

/* ---------- עזרי נתונים ---------- */
const getItem = (section, id) => section === "guests" ? (state.guests?.[id]) : (state.items?.[section]?.[id]);
const basePath = (section, id) => section === "guests" ? ("guests/" + id) : ("items/" + section + "/" + id);
const entriesSorted = (obj) => Object.entries(obj || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));

function initDraft(section) {
  const d = {};
  (SECTION_FIELDS[section] || []).forEach((f) => { d[f.k] = f.type === "owner" ? currentUser : ""; });
  return d;
}
function initDraftFromItem(section, item) {
  const d = {};
  (SECTION_FIELDS[section] || []).forEach((f) => { d[f.k] = item?.[f.k] ?? ""; });
  return d;
}

/* ---------- AI: הצעת מצרכים ---------- */
function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}
function parseIngredients(text) {
  return String(text || "")
    .split("\n")
    .map((l) => l.replace(/^[\s\-*••\d.)]+/, "").trim())
    .filter(Boolean)
    .filter((v, i, a) => a.indexOf(v) === i)
    .slice(0, 25);
}
function fallbackIngredients(title, desc) {
  const hay = ((title || "") + " " + (desc || ""));
  for (const m of MEAL_FALLBACK) { if (m.kw.some((k) => hay.includes(k))) return m.items.slice(); }
  return GENERIC_INGREDIENTS.slice();
}
async function suggestIngredients(title, desc) {
  try {
    if (!fbApp) throw new Error("no firebase app");
    const { getAI, getGenerativeModel, GoogleAIBackend } = await import(`https://www.gstatic.com/firebasejs/${AI_CDN_VERSION}/firebase-ai.js`);
    const ai = getAI(fbApp, { backend: new GoogleAIBackend() });
    const model = getGenerativeModel(ai, { model: AI_MODEL_NAME });
    const prompt = `אני מכין/ה את הארוחה "${title || "ארוחת קמפינג"}" לטיול קמפינג.` +
      (desc ? ` תיאור: ${desc}.` : "") +
      ` כתוב/י רשימת מצרכים לקנייה עבור הארוחה. כל מצרך בשורה נפרדת, בעברית, בלי מספור, בלי כותרות ובלי סימני מקף — רק שמות המצרכים.`;
    const res = await withTimeout(model.generateContent(prompt), 15000);
    const text = res.response.text();
    const lines = parseIngredients(text);
    if (lines.length) return lines;
    throw new Error("empty result");
  } catch (e) {
    return fallbackIngredients(title, desc);
  }
}

/* ---------- פעולות ---------- */
window.actions = {
  setTab(k) { tab = k; render(); },
  setShopBucket(k) {
    shopBucket = k === "home" ? "home" : "buy";
    addOpen.delete("add:shopping");
    delete drafts["add:shopping"];
    render();
  },
  meta(field, el) { debounced("meta:" + field, () => wr("meta/" + field, el.value)); },

  /* זהות */
  chooseIdentity(name) {
    currentUser = name;
    localStorage.setItem("campUser", name);
    showOverlay = false; overlayOther = false;
    renderOverlay(); render();
  },
  openIdentity() { showOverlay = true; overlayOther = false; renderOverlay(); },
  showOther() { overlayOther = true; renderOverlay(); const el = document.getElementById("ovOtherInput"); if (el) el.focus(); },
  confirmOther() {
    const el = document.getElementById("ovOtherInput");
    const v = (el?.value || "").trim();
    if (v) this.chooseIdentity(v);
  },

  /* כרטיסים כלליים */
  toggleCard(section, id) {
    const key = section + ":" + id;
    if (openCards.has(key)) { openCards.delete(key); delete drafts["edit:" + key]; }
    else { openCards.add(key); drafts["edit:" + key] = initDraftFromItem(section, getItem(section, id) || {}); }
    render();
  },
  toggleDone(section, id) {
    const cur = getItem(section, id)?.done;
    wr(basePath(section, id) + "/done", !cur);
  },
  del(section, id) {
    rm(basePath(section, id));
    openCards.delete(section + ":" + id);
    delete drafts["edit:" + section + ":" + id];
    render();
  },

  /* טפסי הוספה/עריכה */
  openAdd(ctx, section) { addOpen.add(ctx); drafts[ctx] = initDraft(section); render(); },
  cancelAdd(ctx) { addOpen.delete(ctx); delete drafts[ctx]; render(); },
  draftInput(ctx, key, el) { (drafts[ctx] || (drafts[ctx] = {}))[key] = el.value; },
  ownerSel(ctx, key, el) {
    const d = drafts[ctx] || (drafts[ctx] = {});
    if (el.value === "__other__") { d["_other_" + key] = true; d[key] = ""; }
    else { d["_other_" + key] = false; d[key] = el.value; }
    render();
  },
  saveAdd(ctx, section) {
    const d = drafts[ctx] || {};
    const fields = SECTION_FIELDS[section];
    const first = fields[0].k;
    if (!(d[first] || "").trim()) return;
    const item = { ts: Date.now(), createdBy: currentUser };
    fields.forEach((f) => { item[f.k] = d[f.k] || ""; });
    if (CHECK_SECTIONS.includes(section)) item.done = false;
    if (section === "shopping") item.bucket = shopBucket;
    const path = section === "guests" ? ("guests/" + uid())
      : section === "quotes" ? ("quotes/" + uid())
      : ("items/" + section + "/" + uid());
    wr(path, item);
    this.cancelAdd(ctx);
  },
  saveEdit(section, id) {
    const ctx = "edit:" + section + ":" + id;
    const d = drafts[ctx] || {};
    const upd = {};
    SECTION_FIELDS[section].forEach((f) => { upd[f.k] = d[f.k] || ""; });
    up(basePath(section, id), upd);
    openCards.delete(section + ":" + id);
    delete drafts[ctx];
    render();
  },

  /* הצעות מחיר */
  toggleQuoteCard(id) {
    const key = "quotes:" + id;
    if (openCards.has(key)) { openCards.delete(key); delete drafts["edit:" + key]; }
    else {
      openCards.add(key);
      const it = state.quotes?.[id] || {};
      const d = {};
      QUOTE_MAIN_FIELDS.forEach((f) => { d[f.k] = it[f.k] ?? ""; });
      d.notes = it.notes ?? "";
      drafts["edit:" + key] = d;
    }
    render();
  },
  saveQuoteEdit(id) {
    const key = "quotes:" + id;
    const ctx = "edit:" + key;
    const d = drafts[ctx] || {};
    const upd = {};
    QUOTE_MAIN_FIELDS.forEach((f) => { upd[f.k] = d[f.k] || ""; });
    upd.notes = d.notes || "";
    up("quotes/" + id, upd);
    openCards.delete(key);
    delete drafts[ctx];
    render();
  },
  delQuote(id) {
    rm("quotes/" + id);
    openCards.delete("quotes:" + id);
    delete drafts["edit:quotes:" + id];
    render();
  },
  toggleInclude(id, slug) {
    const cur = !!state.quotes?.[id]?.includes?.[slug];
    wr("quotes/" + id + "/includes/" + slug, !cur);
  },

  /* ציוד אישי */
  fillBasics() {
    const batch = {};
    BASIC_PERSONAL.forEach((t, i) => (batch[uid() + i] = { item: t, ts: Date.now() + i, createdBy: currentUser }));
    up("items/personal", batch);
  },

  /* ציוד משותף */
  fillGear() {
    const batch = {};
    BASIC_GEAR.forEach((t, i) => (batch[uid() + i] = { item: t, owner: "", ts: Date.now() + i, createdBy: currentUser }));
    up("items/gear", batch);
  },
  /* מוסיף רק שמות חסרים לכל תת־רשימה — לא מוחק ולא דורס פריטים קיימים */
  fillShopping() {
    const have = { buy: new Set(), home: new Set() };
    Object.values(state.items?.shopping || {}).forEach((it) => {
      const name = (it.item || "").trim();
      if (name) have[shopBucketOf(it)].add(name);
    });
    const batch = {};
    const addMissing = (seeds, bucket, names) => {
      seeds.forEach((s, i) => {
        if (names.has(s.item)) return;
        batch[uid() + i] = {
          item: s.item, qty: s.qty || "", price: "", done: false,
          ts: Date.now() + i, createdBy: currentUser, bucket,
        };
      });
    };
    addMissing(BASIC_SHOP_BUY, "buy", have.buy);
    addMissing(BASIC_SHOP_HOME, "home", have.home);
    if (Object.keys(batch).length) up("items/shopping", batch);
  },
  claim(section, id) {
    if (!currentUser) return;
    const cur = getItem(section, id)?.owner;
    if (cur && cur !== currentUser) return;
    wr(basePath(section, id) + "/owner", cur === currentUser ? "" : currentUser);
  },

  /* AI */
  async aiSuggest(mealId) {
    aiState[mealId] = { loading: true, suggestions: [] };
    render();
    const meal = state.items?.meals?.[mealId] || {};
    const list = await suggestIngredients(meal.title || "", meal.desc || "");
    aiState[mealId] = { loading: false, suggestions: list.map((t) => ({ text: t, checked: true })) };
    render();
  },
  aiToggle(mealId, idx) {
    const st = aiState[mealId];
    if (st && st.suggestions[idx]) { st.suggestions[idx].checked = !st.suggestions[idx].checked; render(); }
  },
  aiCancel(mealId) { delete aiState[mealId]; render(); },
  aiAdd(mealId) {
    const st = aiState[mealId];
    if (!st) return;
    const meal = state.items?.meals?.[mealId] || {};
    const batch = {};
    st.suggestions.filter((s) => s.checked).forEach((s, i) => {
      batch[uid() + i] = { item: s.text, qty: "", owner: meal.owner || "", createdBy: currentUser, done: false, ts: Date.now() + i, bucket: "buy" };
    });
    up("items/shopping", batch);
    delete aiState[mealId];
    render();
  },
};

/* ---------- רינדור ---------- */
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

function ownerField(ctx, key, value) {
  const otherFlag = drafts[ctx]?.["_other_" + key];
  const isOther = otherFlag || (value && !NAMES.includes(value));
  const opts = NAMES.map((n) => `<option value="${esc(n)}" ${value === n && !isOther ? "selected" : ""}>${esc(n)}</option>`).join("");
  return `<select class="fsel" onchange="actions.ownerSel('${ctx}','${key}',this)">
      <option value="">— בחר —</option>
      ${opts}
      <option value="__other__" ${isOther ? "selected" : ""}>אחר...</option>
    </select>
    ${isOther ? `<input class="finput" placeholder="שם" value="${esc(value)}" data-fid="${ctx}:${key}" oninput="actions.draftInput('${ctx}','${key}',this)">` : ""}`;
}

function formFieldsHtml(ctx, fields) {
  const d = drafts[ctx] || {};
  return fields.map((f) => {
    const v = d[f.k] ?? "";
    let control;
    if (f.type === "owner") control = ownerField(ctx, f.k, v);
    else if (f.type === "textarea") control = `<textarea class="finput ftext" placeholder="${esc(f.ph)}" data-fid="${ctx}:${f.k}" oninput="actions.draftInput('${ctx}','${f.k}',this)">${esc(v)}</textarea>`;
    else {
      const typeAttr = f.input === "number" ? `type="number" inputmode="decimal" min="0" step="any"` : "";
      control = `<input class="finput ${f.type === "num" ? "fnum" : ""}" ${typeAttr} placeholder="${esc(f.ph)}" value="${esc(v)}" data-fid="${ctx}:${f.k}" oninput="actions.draftInput('${ctx}','${f.k}',this)">`;
    }
    return `<div class="flabel">${esc(f.ph)}</div>${control}`;
  }).join("");
}

function summary(section, it) {
  if (section === "people")   return { title: it.name || "(ללא שם)", meta: it.role || "" };
  if (section === "meals")    return { title: it.title || "(ללא שם)", meta: it.desc || "" };
  if (section === "shopping") return { title: it.item || "(פריט)", meta: [it.qty || "", it.price ? "₪" + it.price : ""].filter(Boolean).join(" · ") };
  if (section === "gear")     return { title: it.item || "(פריט)", meta: it.owner || "" };
  if (section === "personal") return { title: it.item || "(פריט)", meta: "" };
  if (section === "guests")   return { title: it.name || "(אורח)", meta: it.arrival || "" };
  return { title: "", meta: "" };
}

function cardHtml(section, it) {
  const id = it.id;
  const open = openCards.has(section + ":" + id);
  const check = CHECK_SECTIONS.includes(section);
  const s = summary(section, it);
  const chk = check ? `<button class="chk ${it.done ? "on" : ""}" onclick="actions.toggleDone('${section}','${id}')">${ICONS.check}</button>` : "";
  const mine = it.owner === currentUser;
  const claim = CLAIM_SECTIONS.includes(section) && currentUser && (!it.owner || mine)
    ? `<button class="claim ${mine ? "on" : ""}" onclick="actions.claim('${section}','${id}')">אני</button>`
    : "";
  const editCtx = "edit:" + section + ":" + id;
  const ai = section === "meals" ? aiSectionHtml(id) : "";
  const body = open ? `
    <div class="card-body">
      ${formFieldsHtml(editCtx, SECTION_FIELDS[section])}
      ${ai}
      <div class="form-actions">
        <button class="btn-del" onclick="actions.del('${section}','${id}')">${ICONS.trash} מחק</button>
        <button class="btn-save" onclick="actions.saveEdit('${section}','${id}')">שמור</button>
      </div>
    </div>` : "";
  return `
    <div class="card ${check && it.done ? "done" : ""}">
      <div class="card-head">
        ${chk}
        <div class="card-main" onclick="actions.toggleCard('${section}','${id}')">
          <div class="card-title">${esc(s.title)}</div>
          ${s.meta ? `<div class="card-sub">${esc(s.meta)}</div>` : ""}
          ${it.createdBy && section !== "shopping" ? `<div class="card-by">נוסף ע"י ${esc(it.createdBy)}</div>` : ""}
        </div>
        ${claim}
        <span class="chev ${open ? "open" : ""}" onclick="actions.toggleCard('${section}','${id}')">${ICONS.chev}</span>
      </div>
      ${body}
    </div>`;
}

function aiSectionHtml(mealId) {
  const st = aiState[mealId];
  if (!st) return `<button class="btn-ai" onclick="actions.aiSuggest('${mealId}')">✨ הצע רשימת מצרכים</button>`;
  if (st.loading) return `<div class="ai-panel"><span class="spinner"></span> &nbsp; מכין רשימת מצרכים...</div>`;
  return `<div class="ai-panel">
      <div class="ai-title">מצרכים מוצעים:</div>
      ${st.suggestions.map((s, i) => `<label class="ai-item"><input type="checkbox" ${s.checked ? "checked" : ""} onclick="actions.aiToggle('${mealId}',${i})"> ${esc(s.text)}</label>`).join("")}
      <div class="form-actions">
        <button class="btn-cancel" onclick="actions.aiCancel('${mealId}')">ביטול</button>
        <button class="btn-save" onclick="actions.aiAdd('${mealId}')">הוסף לרשימת הקניות</button>
      </div>
    </div>`;
}

function addCardHtml(ctx, section, word) {
  if (addOpen.has(ctx)) {
    const fields = SECTION_FIELDS[section];
    return `<div class="card add-open">
      <div class="card-body">
        ${formFieldsHtml(ctx, fields)}
        <div class="form-actions">
          <button class="btn-cancel" onclick="actions.cancelAdd('${ctx}')">ביטול</button>
          <button class="btn-save" onclick="actions.saveAdd('${ctx}','${section}')">הוסף</button>
        </div>
      </div>
    </div>`;
  }
  return `<button class="add" onclick="actions.openAdd('${ctx}','${section}')">${ICONS.plus} הוסף ${word}</button>`;
}

function genericHtml(section) {
  const sec = SECTIONS.find((s) => s.key === section);
  const items = entriesSorted(state.items?.[section]);
  const cards = items.map((it) => cardHtml(section, it)).join("");
  const empty = items.length ? "" : `
    <div class="empty">
      ${sec.empty}
      ${section === "personal" ? `<br><button class="fill-btn" onclick="actions.fillBasics()">✦ מלא רשימה בסיסית</button>` : ""}
      ${section === "gear" ? `<br><button class="fill-btn" onclick="actions.fillGear()">✦ מלא רשימה בסיסית</button>` : ""}
    </div>`;
  return empty + cards + addCardHtml("add:" + section, section, ADD_WORD[section]);
}

function shoppingHtml() {
  const items = entriesSorted(state.items?.shopping).filter((it) => shopBucketOf(it) === shopBucket);
  const emptyMsg = shopBucket === "home" ? "עוד אין פריטים מהבית." : "עוד אין מה לקנות.";
  const empty = items.length ? "" : `<div class="empty">${emptyMsg}</div>`;
  const cards = items.map((it) => cardHtml("shopping", it)).join("");
  return `
    <div class="seg">
      <button class="seg-btn ${shopBucket === "buy" ? "active" : ""}" onclick="actions.setShopBucket('buy')">לקנות</button>
      <button class="seg-btn ${shopBucket === "home" ? "active" : ""}" onclick="actions.setShopBucket('home')">אפשר מהבית</button>
    </div>
    <div class="fill-row"><button class="fill-btn" onclick="actions.fillShopping()">✦ מלא רשימה</button></div>
    ${empty}${cards}
    ${addCardHtml("add:shopping", "shopping", ADD_WORD.shopping)}`;
}

function peopleHtml() {
  const parts = entriesSorted(state.items?.people);
  const partsCards = parts.map((it) => cardHtml("people", it)).join("");
  const partsEmpty = parts.length ? "" : `<div class="empty">${SECTIONS[0].empty}</div>`;

  const guests = entriesSorted(state.guests);
  const guestCards = guests.map((it) => cardHtml("guests", it)).join("");
  const guestEmpty = guests.length ? "" : `<div class="empty">עוד אין אורחים — הוסיפו מי שמצטרף לביקור וגם מתי הוא מגיע.</div>`;

  return `
    ${partsEmpty}${partsCards}
    ${addCardHtml("add:people", "people", "משתתף")}
    <div class="sub-head">${icon("users", 16)} אורחים</div>
    ${guestEmpty}${guestCards}
    ${addCardHtml("add:guests", "guests", "אורח")}`;
}

function quoteCardHtml(q) {
  const id = q.id;
  const key = "quotes:" + id;
  const ctx = "edit:" + key;
  const open = openCards.has(key);
  const inc = q.includes || {};
  const incCount = Object.values(inc).filter(Boolean).length;
  const subtitle = [
    q.phone ? `<a href="tel:${esc(q.phone)}" onclick="event.stopPropagation()" style="color:inherit">${esc(q.phone)}</a>` : "",
    q.receivedBy ? `קיבל/ה: ${esc(q.receivedBy)}` : "",
  ].filter(Boolean).join(" · ");
  const body = open ? `
    <div class="card-body">
      <div class="ai-panel">
        <div class="ai-title">מה כלול בהצעה:</div>
        ${GEAR_ITEMS.map((g) => `<label class="ai-item"><input type="checkbox" ${inc[g.slug] ? "checked" : ""} onclick="actions.toggleInclude('${id}','${g.slug}')"> ${esc(g.label)}</label>`).join("")}
      </div>
      ${formFieldsHtml(ctx, [QUOTE_NOTES_FIELD])}
      ${formFieldsHtml(ctx, QUOTE_MAIN_FIELDS)}
      <div class="form-actions">
        <button class="btn-del" onclick="actions.delQuote('${id}')">${ICONS.trash} מחק</button>
        <button class="btn-save" onclick="actions.saveQuoteEdit('${id}')">שמור</button>
      </div>
    </div>` : "";
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-main" onclick="actions.toggleQuoteCard('${id}')">
          <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span>${esc(q.business || "(ללא שם עסק)")}</span>
            ${q.price ? `<span class="price">₪${esc(q.price)}</span>` : ""}
          </div>
          ${subtitle ? `<div class="card-sub">${subtitle}</div>` : ""}
          ${q.createdBy ? `<div class="card-by">נוסף ע"י ${esc(q.createdBy)}</div>` : ""}
          ${incCount ? `<div class="qbadges"><span class="qbadge">כולל ${incCount} פריטים</span></div>` : ""}
        </div>
        <span class="chev ${open ? "open" : ""}" onclick="actions.toggleQuoteCard('${id}')">${ICONS.chev}</span>
      </div>
      ${body}
    </div>`;
}

function quotesHtml() {
  const sec = SECTIONS.find((s) => s.key === "quotes");
  const items = entriesSorted(state.quotes);
  const cards = items.map((q) => quoteCardHtml(q)).join("");
  const empty = items.length ? "" : `<div class="empty">${sec.empty}</div>`;
  return empty + cards + addCardHtml("add:quotes", "quotes", "הצעת מחיר");
}

function renderOverlay() {
  if (!showOverlay) { overlay.style.display = "none"; overlay.innerHTML = ""; return; }
  overlay.style.display = "flex";
  const namesHtml = NAMES.map((n) => `<button class="ov-name" onclick="actions.chooseIdentity('${esc(n)}')">${esc(n)}</button>`).join("");
  overlay.innerHTML = `
    <div class="ov-box">
      <h2>⛺ מי אתה?</h2>
      <p>בחרו את השם שלכם — כל מה שתוסיפו יתויג על שמכם.</p>
      <div class="ov-names">
        ${namesHtml}
        <button class="ov-name ov-other" onclick="actions.showOther()">אחר...</button>
      </div>
      ${overlayOther ? `
        <div class="ov-input-row">
          <input id="ovOtherInput" placeholder="הקלד שם" onkeydown="if(event.key==='Enter')actions.confirmOther()">
          <button onclick="actions.confirmOther()">אישור</button>
        </div>` : ""}
    </div>`;
  if (overlayOther) { const el = document.getElementById("ovOtherInput"); if (el) el.focus(); }
}

function render() {
  // שימור פוקוס
  const ae = document.activeElement;
  const focus = ae && ae.dataset && ae.dataset.fid
    ? { fid: ae.dataset.fid, val: ae.value, sel: ae.selectionStart }
    : null;

  renderOverlay();

  if (configMissing) {
    app.innerHTML = `
      <div class="setup">
        <h2>⛺ עוד צעד אחד</h2>
        חסר חיבור למסד הנתונים. פתחו את <code>index.html</code>,
        עקבו אחרי ההוראות בתחילת הסקריפט והדביקו את ה-<code>firebaseConfig</code> שלכם.
      </div>`;
    return;
  }

  const tabsHtml = SECTIONS.map((s) => {
    let badge = "";
    if (s.key === "quotes") {
      const n = Object.keys(state.quotes || {}).length;
      if (n) badge = String(n);
    } else if (CHECK_SECTIONS.includes(s.key)) {
      const arr = Object.values(state.items?.[s.key] || {});
      if (arr.length) badge = `${arr.filter((i) => i.done).length}/${arr.length}`;
    } else {
      const n = Object.keys(state.items?.[s.key] || {}).length;
      if (n) badge = String(n);
    }
    return `
      <button class="tab ${tab === s.key ? "active" : ""}" onclick="actions.setTab('${s.key}')">
        <span style="color:${tab === s.key ? "var(--amber)" : "var(--muted)"};display:flex">${icon(s.icon, 15)}</span>
        ${s.label}
        ${badge ? `<span class="badge">${badge}</span>` : ""}
      </button>`;
  }).join("");

  let bodyHtml;
  if (tab === "quotes") bodyHtml = quotesHtml();
  else if (tab === "people") bodyHtml = peopleHtml();
  else if (tab === "shopping") bodyHtml = shoppingHtml();
  else bodyHtml = genericHtml(tab);

  app.innerHTML = `
    <div class="sign">
      <div class="sign-top">
        <div class="sign-title">
          ${icon("tent", 26)}
          <input value="${esc(state.meta.name)}" placeholder="שם הטיול"
            data-fid="meta:name" oninput="actions.meta('name',this)" />
        </div>
        <div class="sync">
          <span class="dot ${connected === "on" ? "on" : connected === "err" ? "err" : ""}"></span>
          ${connected === "on" ? "מסונכרן" : connected === "err" ? "אין חיבור" : "מתחבר..."}
        </div>
      </div>
      <div class="sign-meta">
        <div>${ICONS.pin}<input value="${esc(state.meta.place)}" placeholder="איפה?"
          data-fid="meta:place" oninput="actions.meta('place',this)" /></div>
        <div>${ICONS.cal}<input value="${esc(state.meta.dates)}" placeholder="מתי?"
          data-fid="meta:dates" oninput="actions.meta('dates',this)" /></div>
      </div>
      <div class="who">מחובר כ: <b>${esc(currentUser || "—")}</b>
        <button class="who-switch" onclick="actions.openIdentity()">החלף</button>
      </div>
    </div>

    <div class="tabs">${tabsHtml}</div>

    <div class="list">
      ${bodyHtml}
      <p class="foot">משותף בזמן אמת — כל מי שיש לו את הקישור רואה ועורך את אותן רשימות.</p>
    </div>`;

  // החזרת פוקוס והערך המקומי (כדי שסנכרון לא ידרוס באמצע הקלדה)
  if (focus) {
    const el = document.querySelector(`[data-fid="${focus.fid}"]`);
    if (el) {
      el.value = focus.val;
      el.focus();
      try { el.setSelectionRange(focus.sel, focus.sel); } catch {}
    }
  }
}

render();
</script>
</body>
</html>
